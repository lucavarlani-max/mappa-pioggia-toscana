name: Aggiorna dati pioggia (SIR Toscana)

on:
  schedule:
    # Ogni giorno alle 05:10 UTC (~07:10 in Italia d'estate, 06:10 d'inverno).
    - cron: '10 5 * * *'
  workflow_dispatch: {}      # permette l'avvio manuale dal tab "Actions"

permissions:
  contents: write            # necessario per ricommittare i dati aggiornati

concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: pip install requests

      - name: Scarica i dati dal SIR Toscana
        # Se il SIR non risponde lo script esce con codice 2 e NON tocca i dati:
        # con "|| true" evitiamo che il workflow risulti fallito.
        run: python aggiorna_dati.py || echo "Aggiornamento saltato (SIR non raggiungibile o pochi dati)."

      - name: Pubblica i dati aggiornati (se cambiati)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stations.json dati.js
          if git diff --cached --quiet; then
            echo "Nessuna novita': dati invariati."
          else
            git commit -m "Aggiornamento dati pioggia $(date -u +%Y-%m-%d)"
            git push
          fi
